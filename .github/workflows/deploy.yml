name: Deploy pi-devops-lab (Pi-hole + Kiosk config)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Raspberry Pi via Tailscale SSH
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Tailscale & join tailnet with SSH enabled
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey "$TAILSCALE_AUTHKEY" \
            --hostname gha-runner \
            --advertise-tags=tag:ci-runner \
            --ssh
          sleep 3

      - name: Verify Pi visibility from runner
        run: |
          tailscale status | grep livingroompi || true
          tailscale ping -c 3 livingroompi || true

      - name: Deploy Pi-hole + inject kiosk URL via Tailscale SSH
        env:
          PIHOLE_WEBPASSWORD: ${{ secrets.PIHOLE_WEBPASSWORD }}
          DAKBOARD_URL: ${{ secrets.DAKBOARD_URL }}
        run: |
          sudo tailscale ssh admin@livingroompi \
            PIHOLE_WEBPASSWORD="$PIHOLE_WEBPASSWORD" \
            DAKBOARD_URL="$DAKBOARD_URL" \
            'bash -s' << 'EOF'
          set -euo pipefail
          cd ~/pi-devops-lab && git pull --ff-only || true

          cd ~/pi-devops-lab/docker/pi-hole
          cat > .env <<EOT
          PIHOLE_IMAGE=pihole/pihole:latest
          PLATFORM=linux/arm64
          TZ=Europe/Amsterdam
          WEBPASSWORD=${PIHOLE_WEBPASSWORD}
          EOT
          docker compose pull
          docker compose up -d

          # Install / refresh the labwc kiosk autostart and inject the DAKboard URL.
          mkdir -p "$HOME/.config/labwc"
          cp ~/pi-devops-lab/kiosk/labwc-autostart "$HOME/.config/labwc/autostart"
          chmod +x "$HOME/.config/labwc/autostart"
          if [ -n "${DAKBOARD_URL:-}" ]; then
            sed -i "s|__DAKBOARD_URL__|${DAKBOARD_URL}|g" "$HOME/.config/labwc/autostart"
          fi
          EOF

      - name: Done
        run: echo "Deploy complete. Pi-hole updated; kiosk points at DAKboard on next graphical boot."