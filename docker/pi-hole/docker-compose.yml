services:
  pihole:
    container_name: pihole
    image: ${PIHOLE_IMAGE}
    platform: ${PLATFORM}
    env_file:
      - .env
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8080:80"
    volumes:
      - "./etc-pihole:/etc/pihole"
      - "./etc-dnsmasq.d:/etc/dnsmasq.d"
    restart: unless-stopped
    # No healthcheck override on purpose: the pihole/pihole v6 image ships a
    # DNS-native check (dig @127.0.0.1 pi.hole), which actually tests the
    # service's job. The old `curl -f http://localhost` override returned 403 on
    # v6 and kept the container permanently "unhealthy".
