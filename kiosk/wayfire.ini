# Wayfire compositor config — NATIVE kiosk for the living-room display.
#
# WHY NATIVE (not containerized):
#   The browser drives the Pi's PHYSICAL HDMI output. Running a browser inside a
#   container that renders to real HDMI on a Pi (Wayland/GPU passthrough) is
#   fragile. Per project policy "containerize services, keep the display native",
#   the SERVICES (Pi-hole, and later DAKboard's backend) are containerized, while
#   the kiosk browser stays native so it reliably lights up the wall display on
#   every boot — including after the nightly reboot.
#
# HOW THE URL GETS HERE:
#   __DAKBOARD_URL__ is a placeholder. It is replaced with the real DAKboard
#   display URL by either:
#     - scripts/pi-bootstrap.sh (reads $DAKBOARD_URL), or
#     - the GitHub Actions pipeline on deploy (from the DAKBOARD_URL secret).
#   The URL itself is a SECRET and is never committed to Git.

[autostart]
# Launch Chromium straight into full-screen kiosk mode pointing at DAKboard.
chromium = chromium-browser --start-maximized --start-fullscreen --kiosk --noerrdialogs --disable-infobars --incognito --disable-session-crashed-bubble --check-for-update-interval=604800 "__DAKBOARD_URL__"

# Keep the screen alive — no blanking, no screensaver on a wall display.
screensaver = false
dpms = false

[idle]
# Never dim or blank the display.
dpms_timeout = -1
screensaver_timeout = -1
