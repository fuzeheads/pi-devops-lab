# LightDM autologin for the DAKboard kiosk.
# Boots straight into the labwc session as 'admin' — no login prompt, no manual steps.
# Installed to /etc/lightdm/lightdm.conf.d/50-kiosk-autologin.conf by pi-bootstrap.sh.
autologin-user=admin
autologin-user-timeout=0
autologin-session=labwc
user-session=labwc
